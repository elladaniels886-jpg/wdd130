<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | White Water Rafting Company</title>
    <meta name="description" content="Contact White Water Rafting Company for bookings, inquiries, and suggestions. Find our location, employees, and send us a message.">
    <meta name="author" content="Daniella Isiuwa">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>


    <header>
       <img src="images/water-rafting-logo.jpg" alt="Company logo">
        <div id="logo"> White water rafting</div>
        <nav>

            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

    
        <section class="contact-info">
            <p>WHITE WATER RAFTING COMPANY</p>
            <p>Zone 1 Dutse</p>
            <p>Abuja, Nigeria</p>
            <p>+2347012583643</p>
            <p>info@whitewater.com</p>
        </section>

        <section class="contact-layout">

            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d31513.080518884442!2d7.3662464000000005!3d9.142271999999998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1781027297070!5m2!1sen!2sng" 
                width="400" height="600" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">

                </iframe>
            </div>

            
            <form class="contact-form" action="#" method="post">

                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your email" required>

                <fieldset class="box">
                    <legend>Purpose of Message</legend>

                    <label>
                        <input type="radio" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" placeholder="Type here..."></textarea>

                <label class="checkbox">
                    <input type="checkbox" name="subscribe">
                    Subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>

            </form>
        </section>

        <!-- EMPLOYEES -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">

                <figure>
                    <img src="images/guy1.jpg" alt="Employee profile"width="200" height="150">
                    <figcaption>Alison Daniel - Raft Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/project-manager.jpg" alt="Employee profile"width="200" height="150">
                    <figcaption>Kadenge Sammy - Operations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/lady.jpg" alt="Employee profile" width="200" height="150">
                    <figcaption>Isiuwa Daniella - Safety Instructor</figcaption>
                </figure>

            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer>
       <p>&copy; 2026 💦White water rafting💦 Daniella Isiuwa-Daniel</p>
        <nav class="socialmedia">
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="linkedin icon">
            </a>
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="facebook icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram icon">
            </a>
        </nav>
    </footer>

</body>
</html>
